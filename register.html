<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register - WellTrack</title><link rel="stylesheet" href="css/style.css"></head><body data-page="register"><main class="auth"><section class="auth-box"><div class="auth-panel soft"><a class="brand" href="index.html"><span class="brand-mark">◌</span><span>WellTrack</span></a><h1>Create your profile.</h1><p class="muted">The first student account is created here. No sample users are added automatically.</p><button class="button secondary" type="button" data-theme>Switch Theme</button></div><form class="auth-panel" id="registerForm"><div class="form-grid"><div class="field"><label for="name">Name</label><input id="name" name="name"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email"></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password"></div><div class="field"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" name="confirmPassword" type="password"></div><div class="field"><label for="course">Course</label><input id="course" name="course"></div><div class="field"><label for="academicYear">Academic Year</label><input id="academicYear" name="academicYear"></div><div class="field wide"><label for="institution">Institution</label><input id="institution" name="institution"></div></div><button class="button full" type="submit">Create Account</button><p class="message" id="registerMessage"></p><p class="muted">Already registered? <a href="login.html"><strong>Login</strong></a></p></form></section></main><div id="toast-root"></div><script src="js/storage.js"></script><script src="js/app.js"></script></body></html>
